                        "lastName":"LastName",
                        "email":"user@server.com",
                        "created": "2017-10-01T09:00:20Z",
                        "updated": "2018-08-24T13:53:02Z",
                        "last_login": "2024-03-01T17:00:00Z",
                        "lastJob": "2018-08-28T13:31:00Z",
                        "tokens": 1
                    },
                    {
                        "login":"admin",
                        "firstName":"Admin",
                        "lastName":"Admin",
                        "email":"admin@server.com",
                        "created": "2016-07-17T18:42:00Z",
                        "updated": "2018-08-24T13:53:00Z",
                        "last_login": "2024-03-01T17:00:00Z",
                        "lastJob": "2018-08-28T13:31:00Z",
                        "tokens": 6
                    }]
              schema:
                items:
                  type: object
                type: array
          description: "Success Response, with a list of users.\n\nFor APIv27+, the\
            \ results will contain additional fields:\n* `created` creation date\n\
            * `updated` updated date\n* `lastJob` last job execution\n* `tokens` number\
            \ of API tokens\nFor APIv53+, the results will also include: \n* `lastLogin`\
            \ last login time\n"
