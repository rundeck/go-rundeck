  securitySchemes:
    rundeckApiToken:
      description: API Token authentication. Include your API token in the X-Rundeck-Auth-Token
        header or as an 'authtoken' query parameter. Tokens can be generated from
        your User Profile page and must have appropriate authorization roles and expiration
        settings.
      in: header
      name: X-Rundeck-Auth-Token
      type: apiKey
    rundeckJWT:
      bearerFormat: JWT
      description: JWT token authentication for OAuth/OIDC integration (Commercial/Enterprise
        only). Include JWT token in Authorization header with Bearer schema.
      scheme: bearer
      type: http
    rundeckPassword:
      description: Session-based authentication using username and password. Submit
        credentials to /j_security_check and maintain JSESSIONID cookie.
      scheme: basic
      type: http
    webhookTokenHeader:
      description: Webhook Event Authorization Security header requires the `Authorization`
        to match the secret value.
      in: header
      name: Authorization
      type: apiKey
