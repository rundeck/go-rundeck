  /job/{id}:
    delete:
      description: |-
        Delete a single job definition.

        Authorization required: `delete` for the job.
      operationId: apiJobDelete
      parameters:
      - content:
          application/json:
            schema:
              type: string
        description: Job ID
        in: path
        name: id
        required: true
      responses:
        "204":
          description: Successful delete. No Content
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Not Found
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Unauthorized
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Unauthorized
        "200":
          content:
            application/json:
              schema:
                type: object
          description: apiJobDelete 200 response
      summary: Deleting a Job Definition
