      - description: List of execution to include to the exported archive
        explode: true
        in: query
        name: executionIds
        required: false
        schema:
          type: string
        style: form
      - description: "true/false, include all project contents (default: true)"
        explode: true
        in: query
        name: exportAll
        required: false
        schema:
          type: string
        style: form
      - description: "true/false, include jobs"
        explode: true
        in: query
        name: exportJobs
        required: false
        schema:
          type: string
        style: form
      - description: "true/false, include executions"
        explode: true
        in: query
        name: exportExecutions
        required: false
        schema:
          type: string
        style: form
      - description: "true/false, include project configuration"
        explode: true
        in: query
        name: exportConfigs
        required: false
        schema:
          type: string
        style: form
      - description: "true/false, include project readme/motd files"
        explode: true
        in: query
        name: exportReadmes
        required: false
        schema:
          type: string
        style: form
      - description: "true/false, include project ACL Policy files, if authorized"
        explode: true
        in: query
        name: exportAcls
        required: false
        schema:
          type: string
        style: form
      - description: "true/false, include project calendars"
        explode: true
        in: query
        name: exportComponents.calendars
        required: false
        schema:
          type: string
        style: form
      - description: "true/false, include schedule definitions"
        explode: true
        in: query
        name: exportComponents.Schedule%20Definitions
        required: false
        schema:
          type: string
        style: form
      - description: "true/false, include tours manager"
        explode: true
        in: query
        name: exportComponents.tours-manager
        required: false
        schema:
          type: string
        style: form
      - description: "true/false, include node wizard"
        explode: true
        in: query
        name: exportComponents.node-wizard
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: archiveParams
        required: true
        schema:
          $ref: "#/components/schemas/ProjectArchiveParams"
        style: form
      responses:
        "200":
          content:
            application/zip:
              schema:
                $ref: "#/components/schemas/OutputStream"
          description: The project exported zip archive file
        "400":
          content:
            application/json:
              schema:
