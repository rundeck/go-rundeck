openapi: 3.0.1
info:
  description: |-
    Rundeck / Runbook Automation REST API for job automation, execution management, and system administration.

    The Rundeck API provides comprehensive access to:
    - Job management (create, update, delete, execute jobs)
    - Execution monitoring and control
    - Project and resource management
    - Node filtering and resource queries
    - System configuration and administration
    - SCM integration (Git and other version control)
    - Authentication token management
    - Metrics and health monitoring

    All API endpoints require authentication via API token, password session, or JWT token (Enterprise).
    API version must be specified in the URL path (e.g., /api/46/...).

    For detailed documentation, see: [Rundeck API Docs](https://docs.rundeck.com/docs/api/)
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: Rundeck / Runbook Automation API
  version: "56"
externalDocs:
  description: Original Rundeck API Documentation
  url: https://docs.rundeck.com/docs/api/
servers:
- description: Rundeck / Runbook Automation Server
  url: "{protocol}://{host}:{port}/api/{version}"
  variables:
    protocol:
      default: https
      description: Protocol (http or https)
      enum:
      - http
      - https
    host:
      default: localhost
      description: Server hostname or IP address
    port:
      default: "4440"
      description: Server port number
    version:
      default: "56"
      description: API version number
security:
- rundeckApiToken: []
- rundeckPassword: []
- rundeckJWT: []
tags:
- description: Access Control List operations
  name: ACL
- description: Ad-hoc command execution operations
  name: Ad Hoc
- description: API information and utilities
  name: API
- description: Check User Authorization operations
  name: Authorization
- description: Calendar management operations
  name: Calendars
- description: Cluster management operations
  name: Cluster
- description: Configuration management
  name: Configuration
- description: Execution Mode operations
  name: Execution Mode
- description: Health check operations
  name: Health
- description: Execution history operations
  name: History
- description: Job management operations
  name: Jobs
- description: Job execution operations
  name: Job Executions
- description: Key storage operations
  name: Key Storage
- description: License management operations
  name: License
- description: Log storage operations
  name: Log Storage
- description: Metrics and monitoring operations
  name: Metrics
- description: Plugin management operations
  name: Plugins
- description: Project management operations
  name: Project
- description: Return on Investment metrics operations
  name: ROI
- description: Runner management operations
  name: Runner
- description: Source Control Management operations
  name: SCM
- description: System operations
  name: System
- description: API token operations
  name: Tokens
- description: User interface tour operations
  name: Tours
- description: User management operations
  name: User
- description: User Class management operations
  name: User Class
- description: Webhook operations
  name: Webhook
paths:
  /:
    get:
      description: |-
        Returns basic information about the Rundeck API including the current API version and base URL.

        This endpoint provides essential API metadata that clients can use to determine available functionality and construct properly formatted API requests. The response includes the highest supported API version number and the base URL for making subsequent API calls.

        Use this endpoint to verify API connectivity and determine the correct API version to use for your integration.
      operationId: info
      responses:
        "200":
          content:
            application/json:
              examples:
                example:
                  value:
                    apiversion: 44
                    href: http://localhost:4441/api/44
              schema:
                type: object
          description: API Information
      summary: Get API Information
      tags:
      - API
  /authorizations/application/{kind}:
    get:
      description: |-
        Evaluates whether the current user has authorization to perform specific actions on resources of a given kind within the application context.

        This endpoint checks permissions for a resource type (kind) such as "job", "project", "system", etc., and returns authorization results for each requested action. The evaluation is performed using the application's access control policies and the authenticated user's permissions.

        Useful for UI components that need to conditionally display features or for applications that need to verify permissions before attempting operations.

        **INCUBATING**: This endpoint is in "incubating" status, and may change.
      operationId: appContextAuthorizationsForResourceKind
      parameters:
      - description: Resource Kind
        explode: false
        in: path
        name: kind
        required: true
        schema:
          type: string
        style: simple
      - description: Actions to check authorization for
        explode: true
        in: query
        name: actions
        required: true
        schema:
          items:
            type: string
          type: array
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationsResponse"
          description: Action authorizations
      summary: Check authorization for application resource kind
      tags:
      - Authorization
  /authorizations/application/{type}/{specifier}:
    get:
      description: "Get authorizations for the supplied set of actions for the subject\
        \ executing the API call. \nEvaluation is made in the context of the application\
        \ for the supplied type and specifier.\n\n**INCUBATING**: This endpoint is\
        \ in \"incubating\" status, and may change."
      operationId: appContextAuthorizationsForTypeWithSpecifier
      parameters:
      - description: Resource Type
        explode: false
        in: path
        name: type
        required: true
        schema:
          type: string
        style: simple
      - description: Resource specifier
        explode: false
        in: path
        name: specifier
        required: true
        schema:
          type: string
        style: simple
      - description: Actions to check authorization for
        explode: true
        in: query
        name: actions
        required: true
        schema:
          items:
            type: string
          type: array
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationsResponse"
          description: Action authorizations
      summary: Get authorizations for an application type with specifier
      tags:
      - Authorization
  /authorizations/project/{project}/job/{specifier}:
    get:
      description: "Get authorizations for the supplied set of actions for the subject\
        \ executing the API call. \nEvaluation is made in the context of the project\
        \ for the supplied job.\n\n**INCUBATING**: This endpoint is in \"incubating\"\
        \ status, and may change."
      operationId: projectContextAuthorizationsForJob
      parameters:
      - description: Project Name
        explode: false
        in: path
        name: project
        required: true
        schema:
          type: string
        style: simple
      - description: Job Id
        explode: false
        in: path
        name: specifier
        required: true
        schema:
          type: string
        style: simple
      - description: Actions to check authorization for
        explode: true
        in: query
        name: actions
        required: true
        schema:
          items:
            type: string
          type: array
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationsResponse"
          description: Action authorizations
      summary: Get authorizations for a job
      tags:
      - Authorization
  /authorizations/project/{project}/{kind}:
    get:
      description: "Get authorizations for the supplied set of actions for the subject\
        \ executing the API call. \nEvaluation is made in the context of the project\
        \ for the supplied resource kind.\n\n**INCUBATING**: This endpoint is in \"\
        incubating\" status, and may change."
      operationId: projectContextAuthorizationsForResourceKind
      parameters:
      - description: Project Name
        explode: false
        in: path
        name: project
        required: true
        schema:
          type: string
        style: simple
      - description: Resource Kind
        explode: false
        in: path
        name: kind
        required: true
        schema:
          type: string
        style: simple
      - description: Actions to check authorization for
        explode: true
        in: query
        name: actions
        required: true
        schema:
          items:
            type: string
          type: array
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationsResponse"
          description: Action authorizations
      summary: Get authorizations for a project resource kind
      tags:
      - Authorization
  /authorizations/project/{project}/{type}/{specifier}:
    get:
      description: "Get authorizations for the supplied set of actions for the subject\
        \ executing the API call. \nEvaluation is made in the context of the project\
        \ for the type with a specifier.\n\n**INCUBATING**: This endpoint is in \"\
        incubating\" status, and may change."
      operationId: projectContextAuthorizationsForTypeWithSpecifier
      parameters:
      - description: Project Name
        explode: false
        in: path
        name: project
        required: true
        schema:
          type: string
        style: simple
      - description: Resource Type
        explode: false
        in: path
        name: type
        required: true
        schema:
          type: string
        style: simple
      - description: Resource specifier
        explode: false
        in: path
        name: specifier
        required: true
        schema:
          type: string
        style: simple
      - description: Actions to check authorization for
        explode: true
        in: query
        name: actions
        required: true
        schema:
          items:
            type: string
          type: array
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationsResponse"
          description: Action authorizations
      summary: Get authorizations for a type with specifier
      tags:
      - Authorization
  /config/delete:
    post:
      description: |
        Delete a single config by key and strata.

        Authorization required: `ops_admin` or `app_admin` for `system` resource.

        Since: v36
      operationId: ConfigDelete
      requestBody:
        content:
          application/json:
            examples:
              example:
                value:
                  key: myCustomConfig
                  strata: default
            schema:
              type: object
        description: |
          Delete Config Request.

          * `key` Required
            * Represents the config to be deleted.
            * Accepts: Any `string`
          * `strata` Optional
            * Whether the config should apply to the current server (`Server`), or to all servers in the cluster (`default`).
            * Accepts: `Server`, `default`
            * Default: `default`
      responses:
        "204":
          description: No Content if successful
        "403":
          description: Unauthorized response
        "200":
          content:
            application/json:
              schema:
                type: object
          description: ConfigDelete 200 response
      summary: "Delete a Single Config Value [Enterprise]"
      tags:
      - Configuration
  /config/get:
    get:
      description: |
        Get the value for a configuration key.

        Authorization required: `ops_admin` or `app_admin` for `system` resource.

        Since: v36
      operationId: ConfigGet
      parameters:
      - description: Configuration key
        explode: true
        in: query
        name: key
        required: true
        schema:
          type: string
        style: form
      - description: "Storage Strata. Can be `server` to indicate the current cluster\
          \ member, or a member UUID, or `default` or global configuration (Default\
          \ value)."
        explode: true
        in: query
        name: strata
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                example:
                  value:
                    key: key.name
                    value: config value
                    strata: default
          description: Result data
        "403":
          description: Unauthorized response
      summary: "Get Configuration Value [Enterprise]"
      tags:
      - Configuration
  /config/getCategories:
    get:
      description: |
        Get the Configuration categories.

        Authorization required: `ops_admin` or `app_admin` for `system` resource.

        Since: v36
      operationId: ConfigGetCategories
      responses:
        "200":
          content:
            application/json:
              examples:
                example:
                  value: |
                    [
                      {
                        "name": "Plugins",
                        "isSubcat": false,
                        "parentCategory": null,
                        "childNodes": [
                          {
                            "name": "Azure",
                            "isSubcat": true,
                            "parentCategory": "Plugins"
                          },
                          {
                            "name": "DataDog",
                            "isSubcat": true,
                            "parentCategory": "Plugins"
                          },
                          {
                            "name": "GCP",
                            "isSubcat": true,
                            "parentCategory": "Plugins"
                          },
                          {
                            "name": "Jenkins",
                            "isSubcat": true,
                            "parentCategory": "Plugins"
                          },
                          {
                            "name": "Oracle",
                            "isSubcat": true,
                            "parentCategory": "Plugins"
                          },
                          {
                            "name": "Sensu",
                            "isSubcat": true,
                            "parentCategory": "Plugins"
                          },
                          {
                            "name": "Sumo Logic",
                            "isSubcat": true,
                            "parentCategory": "Plugins"
                          }
                        ]
                      },
                      {
                        "name": "SSO",
                        "isSubcat": false,
                        "parentCategory": null,
                        "childNodes": [
                          {
                            "name": "Azure",
                            "isSubcat": true,
                            "parentCategory": "SSO"
                          },
                          {
                            "name": "Okta",
                            "isSubcat": true,
                            "parentCategory": "SSO"
                          },
                          {
                            "name": "Ping",
                            "isSubcat": true,
                            "parentCategory": "SSO"
                          }
                        ]
                      }
                    ]
          description: |
            Categories Result.

            Result is an array of categories, which may have one level of sub-categories.

            Each category has fields:

            * `name` category name
            * `isSubcat` true if it is a subcategory
            * `parentCategory` name of parent category if it is a subcategory
            * `childNodes` array of subcategories
      summary: "Get Configuration Categories [Enterprise]"
      tags:
      - Configuration
  /config/list:
    get:
      description: |
        List all existing configs and their properties.

        Authorization required: `ops_admin` or `app_admin` for `system` resource.

        Since: v36
      operationId: ConfigList
      responses:
        "200":
          content:
            application/json:
              examples:
                example:
                  value: |-
                    [
                      {
                        "name": "azure.clientId",
                        "value": "test222236",
                        "level": "default",
                        "label": "Azure Client ID",
                        "category": "Plugins/Azure"
                      },
                      {
                        "name": "myCustomConfig",
                        "value": "myConfigValue",
                        "level": "default",
                        "category": "Custom",
                      },
                      {
                        "name": "myCustomConfig2",
                        "value": "myConfigValue2",
                        "level": "default",
                        "category": "Custom",
                      }
                    ]
          description: |
            Call was successful. A list of all configs stored using Configuration Management is returned.

            _NOTE: For a complete list of all configs, reference the System Report page in Rundeck._
        "403":
          description: Unauthorized response
      summary: "List All Current Configurations [Enterprise]"
      tags:
      - Configuration
  /config/listStoragePlugins:
    get:
      description: |
        List all existing configs and their properties for storage plugins.

        Authorization required: `app_admin`.
      operationId: StorageConfigList
      responses:
        "200":
          content:
            application/json:
              examples:
                example:
                  value: "[\n      {\n        \"type\": \"exampleProvider\",\n   \
                    \     \"path\": \"keys/exampleProvider\",\n        \"extra\":\
                    \ {\n            \"extraConfig\": \"value\"\n        },\n    \
                    \    \"config\": {\n            \"password\": \"pass\",\n    \
                    \        \"username\": \"user123\",\n        }\n      },\n   \
                    \   {\n        \"type\": \"testprovider2\",\n        \"path\"\
                    : \"keys/testprovider2\",\n        \"extra\": {\n            \"\
                    extraConfig\": \"value\"\n        },\n        \"config\": {\n\
                    \            \"password\": \"pass\",\n            \"username\"\
                    : \"user123\",\n        }\n        \n      }\n]"
          description: |
            Call was successful. A list of all configs stored using Configuration Management is returned.

            _NOTE: For a complete list of all configs, reference the System Report page in Rundeck._
        "403":
          description: Unauthorized response
      summary: "List All Currently configured Storage Plugins [Enterprise]"
      tags:
      - Configuration
  /config/metaList:
    get:
      description: |
        List all known configuration key names and metadata.

        Authorization required: `ops_admin` or `app_admin` for `system` resource.

        Since: v36
      operationId: ConfigMetaList
      responses:
        "200":
          content:
            application/json:
              examples:
                example:
                  value: |-
                    [
                      {
                        "key": "rundeck.api.tokens.duration.max",
                        "visibility": "Advanced",
                        "category": "API",
                        "strata": "default",
                        "required": false,
                        "restart": false,
                        "label": "API Token Duration Max",
                        "datatype": "String",
                        "encrypted": false,
                        "defaultValue": "",
                        "link": "",
                        "description": "",
                        "authRequired": "app_admin"
                      },
                      {
                        "key": "rundeck.authRateLimiting.enabled",
                        "visibility": "Advanced",
                        "category": "Authentication",
                        "strata": "default",
                        "required": false,
                        "restart": false,
                        "label": "Enable authentication rate limiting feature",
                        "datatype": "Boolean",
                        "encrypted": false,
                        "defaultValue": "FALSE",
                        "link": "https://docs.rundeck.com/docs/administration/security/rateLimiting.html",
                        "description": "Enable or disable the authentication rate limiting feature",
                        "authRequired": "ops_admin"
                      }
                    ]
          description: |
            Call was successful. A list of all configuration keys is returned.
        "403":
          description: Unauthorized response
      summary: "List Configuration Metadata [Enterprise]"
      tags:
      - Configuration
  /config/refresh:
    post:
      description: |
        Make the Rundeck server re-read the config properties file.

        Authorization required: `ops_admin` or `app_admin` for `system` resource.

        Since: v36
      operationId: refresh
      responses:
        "200":
          content:
            application/json:
              examples:
                example:
                  value:
                    msg: Rundeck configuration refreshed
          description: |-
            The call was successful. Rundeck will reread the config properties file.

            _NOTE: Some config changes will not go into effect after a reload, and require a full restart of Rundeck._
      summary: "Refresh Configurations from Properties File [Enterprise]"
      tags:
      - Configuration
  /config/restart:
    post:
      description: |-
        Restart the server. Requires that the server container supports the operation.

        Authorization required: `ops_admin` for `system` resource

        Since: v36
      operationId: restart
      responses:
        "200":
          content:
            application/json:
              examples:
                example:
                  value:
                    msg: Result message
                    restarting: true
          description: The call was successful. The Rundeck server will immediately
            restart.
      summary: "Restart the Rundeck Server [Enterprise]"
      tags:
      - Configuration
  /config/save:
    post:
      description: |
        Create or update configs and properties.

        Authorization required: `ops_admin` or `app_admin` for `system` resource.

        Since: v36
      operationId: ConfigSave
      requestBody:
        content:
          application/json:
            examples:
              example:
                value: |-
                  [
                    {
                      "key": "myCustomConfig",
                      "value": "newValueForCustomConfig",
                      "strata": "default"
                    },
                    {
                      "key": "myNewCustomConfig",
                      "value": "valueOfNewCustomConfig",
                      "strata": "default"
                    }
                  ]
            schema:
              items:
                type: object
              type: array
        description: |
          Update Config Request.
          List of config values, each value contains:

          * `key` Required
            * Represents either a new config to be created, or an existing config to be updated.
            * Accepts: Any `string`
          * `value` Required
            * The value for the desired config `key`.
            * Accepts: Any `string`
          * `strata` Optional
            * Whether the config should apply to the current server (`Server`), or to all servers in the cluster (`default`).
            * Accepts: `Server`, `default`
            * Default: `default`
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                example:
                  value:
                    msg: Saved
                    restart: true
                    created:
                    - myNewCustomConfig
                    updated:
                    - myCustomConfig
          description: All configs were successfully saved or updated. A payload reflecting
            save or creation status is returned. `restart` will indicate if the server
            must be restarted for some changes to take effect.
        "400":
          description: Bad request
        "403":
          description: Unauthorized response
      summary: "Create or Update Configurations [Enterprise]"
      tags:
      - Configuration
  /config/saveStoragePlugins:
    post:
      description: "Create or update configs and properties for storage plugins.\n\
        \nAuthorization required: `app_admin`. \n\n"
      operationId: StorageConfigSave
      requestBody:
        content:
          application/json:
            examples:
              example:
                value: "{\n  \"plugins\": {\n     \"0\" : {\n        {\n        \"\
                  type\": \"exampleProvider1\",\n        \"path\": \"keys/exampleProvider1\"\
                  ,\n        \"extra\": {\n            \"extraConfig\": \"value\"\n\
                  \        },\n        \"config\": {\n            \"password\": \"\
                  pass\",\n            \"username\": \"user123\",\n        }\n   \
                  \   },\n     }\n  },\n  \"removedPlugins\": {\n     \"0\" : {\n\
                  \        {\n        \"type\": \"exampleProvider2\",\n        \"\
                  path\": \"keys/exampleProvider2\",\n        \"extra\": {\n     \
                  \       \"extraConfig\": \"value\"\n        },\n        \"config\"\
                  : {\n            \"password\": \"pass\",\n            \"username\"\
                  : \"user123\",\n        }\n      },\n     }\n  }\n  \n}"
            schema:
              items:
                type: object
              type: array
        description: |
          Update Storage Plugin Config Request.
          Configured plugins to be saved should be specified in the `plugins` array. Plugins that have been deleted should be specified in the `removedPlugins` array.
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                example:
                  value:
                    msg: Saved
                    restart: true
                    created:
                    - myNewCustomConfig
                    updated:
                    - myCustomConfig
                    deleted:
                    - myDeletedCustomConfig
          description: All configs were successfully saved or updated. A payload reflecting
            save or creation status is returned.
        "400":
          description: Bad request
        "403":
          description: Unauthorized response
      summary: "Create or Update Storage Plugins [Enterprise]"
      tags:
      - Configuration
  /enterprise/cluster/executions/disable:
    post:
      description: "Set the Execution Mode for the target cluster member.\n\n* `/enterprise/cluster/executions/enable`:\
        \ Set execution mode to *Active* \n* `/enterprise/cluster/executions/disable`:\
        \ Set execution mode to *Passive* \n\nIf the UUID parameter matches the current\
        \ cluster member, the mode will be changed immediately, otherwise the status\
        \ will be `pending`.\n\nAuthorization required: (enable) `enable_executions`\
        \ or `admin` for `system` resource, or \n(disable) `disable_executions` or\
        \ `admin` for `system` resource.\n\nSince: v41\n"
      operationId: apiToggle
      parameters:
      - description: UUID of Member
        explode: true
        in: query
        name: uuid
        required: true
        schema:
          format: uuid
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                example:
                  value:
                    status: pending
                    executionMode: active
                    uuid: a3de6030-2b7a-47e3-b46f-3e46a11a85d9
              schema:
                type: object
          description: |
            Result.

            `status`
            :   `pending` indicates the request has been posted, `complete` indicates the request has taken effect already.

            `executionMode`
            :   The requested execution mode, either `active` or `passive`

            `uuid`
            :   The target cluster member UUID
      summary: "Set Execution Mode for a Cluster Member [Enterprise]"
      tags:
      - Cluster
  /enterprise/cluster/executions/enable:
    post:
      description: "Set the Execution Mode for the target cluster member.\n\n* `/enterprise/cluster/executions/enable`:\
        \ Set execution mode to *Active* \n* `/enterprise/cluster/executions/disable`:\
        \ Set execution mode to *Passive* \n\nIf the UUID parameter matches the current\
        \ cluster member, the mode will be changed immediately, otherwise the status\
        \ will be `pending`.\n\nAuthorization required: (enable) `enable_executions`\
        \ or `admin` for `system` resource, or \n(disable) `disable_executions` or\
        \ `admin` for `system` resource.\n\nSince: v41\n"
      operationId: apiToggle_1
      parameters:
      - description: UUID of Member
        explode: true
        in: query
        name: uuid
        required: true
        schema:
          format: uuid
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                example:
                  value:
                    status: pending
                    executionMode: active
                    uuid: a3de6030-2b7a-47e3-b46f-3e46a11a85d9
              schema:
                type: object
          description: |
            Result.

            `status`
            :   `pending` indicates the request has been posted, `complete` indicates the request has taken effect already.

            `executionMode`
            :   The requested execution mode, either `active` or `passive`

            `uuid`
            :   The target cluster member UUID
      summary: "Set Execution Mode for a Cluster Member [Enterprise]"
      tags:
      - Cluster
  /enterprise/license:
    get:
      description: Returns metadata about the current License for Runbook Automation
      operationId: verify
      responses:
        "200":
