      requestBody:
        content:
          application/yaml:
            examples:
              example:
                value: |-
                  description: "my policy"
                  context:
                    application: rundeck
                  for:
                    project:
                      - allow: read
                  by:
                    group: build
            schema:
              type: string
          application/json:
            examples:
              example:
                value:
                  contents: |-
                    description: "my policy"
                    context:
                      application: rundeck
                    for:
                      project:
                        - allow: read
                    by:
                      group: build
            schema:
              type: object
        description: |
          If the `Content-Type` is `application/yaml` or `text/plain`, then the request body is the ACL policy contents directly.

          Otherwise, you can use JSON to wrap the yaml content inside `contents`
      responses:
        "201":
          content:
            text/plain:
              examples:
                example:
                  value: |-
                    description: "my policy"
                    context:
                      application: rundeck
