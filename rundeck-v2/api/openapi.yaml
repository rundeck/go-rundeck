  /project/{project}/calendars:
    get:
      description: |-
        Retrieves all calendars configured at the project scope level. Calendars are used to define allowed and blackout periods for job scheduling and execution, providing fine-grained control over when jobs can run within a specific project context. This endpoint returns comprehensive calendar information including date definitions, recurrence patterns, and associated job references.

        Authorization required: `admin` or `app_admin` access for `user` resource type.

        Since: v41
      operationId: apiProjectCalendars
      parameters:
      - description: Project Name
        explode: false
        in: path
        name: project
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              examples:
                example:
                  value: |-
                    [
                      {
                        "id": 1,
                        "name": "[NAME]",
                        "description": "[DESCRIPTION]",
                        "calendarType": "[blackout/allowed]",
                        "scope": "project",
                        "project": "[PROJECT]",
                        "dateType": "[date,range,daily,monthly]",
                        "dateDefinition": ""[DATE-DEFINITION]"",
                        "enable": true,
                        "allReference": true,
                        "recurrent": true,
                        "objects": [
                          {
                            "uuid": "[JOBUUID]",
                            "name": "[JOBNAME"]
                          }
                        ]
                      }
                    ]
              schema:
                items:
                  type: object
                type: array
          description: List of all calendar of a project
      summary: "List Project Calendars [Enterprise]"
      tags:
      - Calendars
    post:
      description: |-
        Create or update a calendar at project scope.
        * if the ID exists, it will update the existing calendar, otherwise a new one will be created.

        Authorization required: `admin` or `app_admin` access for `user` resource type.

        Since: v41
      operationId: apiLoadProjectCalendars
      parameters:
      - description: Project Name
        explode: false
        in: path
        name: project
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            examples:
              example:
                value:
                  id: 1
                  name: "[NAME]"
                  description: "[DESCRIPTION]"
                  calendarType: "[blackout/allowed]"
                  scope: project
                  project: "[PROJECT]"
                  dateType: "[date,range,daily,monthly]"
                  dateDefinition: "[DATE-DEFINITION]"
                  enable: true
                  allReference: true
                  recurrent: true
                  objects:
                  - uuid: "[JOBUUID]"
                    name: "[JOBNAME]"
                  - uuid: "[JOBUUID]"
                    name: "[JOBNAME]"
            schema:
              type: object
      responses:
        "200":
          content:
            application/json:
              examples:
                example:
                  value:
                    calendar:
                      id: 1
                      name: New Calendar
                      description: test
                      calendarType: blackout
                      scope: project
                      project: Demo
                      dateType: date
                      dateDefinition:
                      - 2019/12/07
                      - 2019/12/14
                      - 2019/12/31
                      - 2020/01/01
                      enable: true
                      allReference: false
                      recurrent: false
                      objects:
                      - uuid: 7ca918bd-b463-4948-96d2-796c0619c2bd
                        name: scheduled/job
                    saved: true
                    msg: Saved Calendar
              schema:
                $ref: "#/components/schemas/ProjectCalendarsResponse"
          description: Calendar created or updated
      summary: "Create/Update Project Calendar [Enterprise]"
      tags:
      - Calendars
